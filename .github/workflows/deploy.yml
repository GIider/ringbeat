name: Test & Deploy

# Runs on push to main, pull requests and manual dispatch. A change that only touches documentation (docs/, *.md at the
# root, LICENSE) runs just the docs tests (tests/docs.test.mjs): no dependencies, browsers, build or deploys. Manual
# dispatch, a force-push and any change that touches other files run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # code=1 unless every file changed since the last push (or since the PR's base) is documentation.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=1
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/.*|[^/]*\.md|LICENSE)$'; then code=0; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 0 ]; then echo "::notice::Documentation-only change: running the docs tests, skipping build and deploys"; fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Docs tests only
        if: needs.changes.outputs.code != '1'
        run: node --test tests/docs.test.mjs
      - if: needs.changes.outputs.code == '1'
        run: npm ci
      - if: needs.changes.outputs.code == '1'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: needs.changes.outputs.code == '1'
        run: npm test
      - if: needs.changes.outputs.code == '1'
        run: SMOKE_BROWSERS=firefox,webkit node scripts/smoke.mjs
      - if: needs.changes.outputs.code == '1'
        run: SMOKE_BROWSERS=webkit SMOKE_DEVICE='iPhone 13' node scripts/smoke.mjs

  build:
    needs: [changes, test]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Create or update latest release
        run: |
          VERSION=$(node scripts/version-lib.mjs)
          (cd dist && zip -qr ../ringbeat.zip .)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest ringbeat.zip \
            --title "v$VERSION (latest build)" \
            --notes "Built from commit ${{ github.sha }} on $(date -u +%Y-%m-%d)" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The API re-plays runs with the game's own modules, so it ships from the same commit as the pages (docs/CLOUD.md).
  # Skipped until the repository has a CLOUDFLARE_API_TOKEN secret (Workers Scripts + D1 edit permissions).
  deploy-api:
    needs: [changes, test]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == '1'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for the Cloudflare token
        id: token
        run: if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::No CLOUDFLARE_API_TOKEN secret, API not deployed"; fi
      - if: steps.token.outputs.ok
        run: npm ci
      - if: steps.token.outputs.ok
        run: npm run migrate
      - if: steps.token.outputs.ok
        run: npm run deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
